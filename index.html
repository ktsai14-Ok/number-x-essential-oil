            1: { title: "開創與獨立", desc: "習慣掌握方向，擁有絕佳的執行力。你總能一眼看透事情的本質，快速做出決定。但在這份堅強背後，其實隱藏著對失控的恐懼。你極度渴望獨立自主，卻也因為走得太快，偶爾會感到孤單。今晚，試著放下「凡事只能靠自己」的重擔，允許身邊的人成為你的依靠。" },
            2: { title: "溫暖與包容", desc: "總是溫柔體貼，是大家公認的公關高手與避風港。你擁有無比細膩的雷達，總能敏銳察覺他人的需求，努力讓身邊的人感到舒服。但也因為過度在乎別人的感受，常讓自己陷入糾結，甚至在不知不覺中弄丟了真實的自己。親愛的，練習把注意力拉回自己身上，有時候，一個明快但不那麼完美的決定，好過無盡的內耗。" },
            3: { title: "表達與純真", desc: "內心住著一個充滿好奇與純真的小孩。你擁有獨特的美感與豐沛的創造力，只要接觸到新鮮有趣的事物，整個人就會發光。然而，你也是個絕對的理想主義者，對於別人的不認同容易感到受傷。請記得，世界本來就不完美，珍惜當下的小確幸，你的光芒不需要所有人的掌聲來證明。" },
            4: { title: "穩定與秩序", desc: "追求極致的安穩與秩序，總能把混亂梳理得井井有條。你是大家最信賴的依靠，不過，生活中的突發狀況常會瞬間引爆你的焦慮。那些對物質與規律的執著，其實都來自對未知的不安。試著相信，真正的安全感來自你強大的內心，偶爾偏離計畫，去承擔一點點改變的風險，或許會遇見意外的美麗風景。" },

            6: { title: "療癒與責任", desc: "充滿大愛的完美照顧者，總能精準接住別人的脆弱。你擁有極強的同理心，習慣把所有的責任扛在肩上，如果沒有得到相對的感激，心底便會生出深深的委屈與疲憊。今晚，請把那份無私的愛分一點給自己，學習設立界線，不要剝奪別人成長的機會，因為你不需要做到完美也能被深深愛著。" },
            7: { title: "探究與真理", desc: "渴望探究事物本質，擁有超凡的觀察力與邏輯。你需要大量的獨處時間來思考與整理內心世界，過度的社交常會嚴重消耗你的能量。有時為了一探究竟，你會固執地鑽牛角尖，甚至逃避不完美的現實。親愛的，給大腦一點喘息的空間，及早面對真實的狀況，答案往往會在平靜中自然浮現。" },

            '456': { title: "4-5-6 秩序/治療線", desc: "你是天生的問題解決專家。能在混亂中理出秩序，甚至有點完美主義。總是把一切打理得井井有條，卻忘了讓自己放鬆。" },
            '789': { title: "7-8-9 權力/靈性線", desc: "你擁有令人羨慕的貴人運。直覺敏銳，總能吸引資源。比起盲目苦幹，你更適合運用智慧與直覺，在冥冥中獲得助力。" },

            '258': { title: "2-5-8 感情/表達線", desc: "你具備極高的同理心與表達天賦。能敏銳察覺周遭情緒，但也常因過度共情或心直口快而帶來內耗。" },

            '357': { title: "3-5-7 人緣/公關線", desc: "你擁有絕佳的人際直覺。總能輕易看穿別人的需求並得體回應，但你極度需要個人空間，把真正的內心藏得很深。" }

            3: { type: "花朵類", missing: "喜悅與魅力", name: "甜橙 × 依蘭", desc: "喚醒內在那個純粹愛笑的孩子。允許生命單純為了喜悅而綻放，不為什麼責任。" },

            5: { type: "葉片類", missing: "空間與呼吸", name: "歐薄荷", desc: "推開現實擁擠感。在有限的喘息空間裡，為你的靈魂打開一扇通往森林的窗。" },

        const energyData = {
            1: { archetype: "果敢進取的開創者", color: "紅", food: "單一原型食物", style: "獨特個性", health: "整體能量", aroma: "木質類", lifeGoal: "掌握生命的自主權，藉由個人堅定的意志去改變並影響周遭的世界。", oils: "雪松、花梨木、松、黑雲杉、東印度白檀木、澳洲檀香、阿米香樹、癒創木、檜木、沉香、樟樹、冷杉、秘魯聖木。", communication: "「我想先聽聽你的意見。」—— 你極度需要被尊重，試著也這樣溫柔地詢問內心的自己，找回不帶防備的安全感。" },

            4: { archetype: "追求安穩的實踐家", color: "綠", food: "優質澱粉", style: "俐落制服風", health: "骨骼系統", aroma: "果實類", lifeGoal: "建立穩固踏實的安全感，在和諧的規律中獲得他人的尊重與深深的肯定。", oils: "佛手柑、葡萄柚、檸檬、甜橙、橘子、萊姆、杜松子、黑胡椒、山雞椒、貞節果、香草。", communication: "「這是有憑有據的。」—— 你需要絕對的安全感與實際證明。但有時，跟著直覺走去冒點險，也是一種美麗的選項。" },

                                        這容易讓你陷入「${numberTraits[bp.missingNums[0]].title}」的兩難，情緒壓抑，思緒活躍。
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Block 4: 命數能量與生活植物處方 -->
                    <div class="bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-sm border border-white/50 animate-slide-up mx-1 mt-4 relative z-10" style="animation-delay: 0.3s;">
                        <h3 class="text-sage font-serif text-base mb-4 tracking-widest flex items-center">
                            ${svgs.flower} 命數能量與生活處方
                        </h3>
                        
                        <div class="bg-oat p-5 rounded-2xl mb-5 border border-sage/10 space-y-4">
                            <div>
                                <h4 class="font-medium text-textMain text-[13px] mb-1">✦ 靈魂深層目標</h4>
                                <p class="text-[13px] text-textLight leading-relaxed text-justify">${energyData[bp.life].lifeGoal}</p>
                            </div>
                            <div>
                                <h4 class="font-medium text-sageDark text-[13px] mb-1">✦ 守護植物 (${energyData[bp.life].aroma})</h4>
                                <p class="text-[12px] text-textLight leading-relaxed text-justify">
                                    ${energyData[bp.life].oils}
                                </p>
                            </div>
                            <div class="pt-2 border-t border-sage/10">
                                <h4 class="font-medium text-sage text-[13px] mb-1">✦ 溝通密碼</h4>
                                <p class="text-[12px] text-textLight leading-relaxed text-justify">${energyData[bp.life].communication}</p>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-3 gap-2 mb-5">
                            <div class="bg-oat p-3 rounded-xl border border-sage/5 text-center">
                                <p class="text-[10px] text-sage mb-0.5 font-medium">幸運色</p>
                                <p class="text-[13px] text-textMain">${energyData[bp.life].color}</p>
                            </div>
                            <div class="bg-oat p-3 rounded-xl border border-sage/5 text-center">
                                <p class="text-[10px] text-sage mb-0.5 font-medium">風格</p>
                                <p class="text-[13px] text-textMain">${energyData[bp.life].style}</p>
                            </div>
                            <div class="bg-oat p-3 rounded-xl border border-sage/5 text-center">
                                <p class="text-[10px] text-sage mb-0.5 font-medium">飲食</p>
                                <p class="text-[13px] text-textMain text-nowrap truncate overflow-hidden">${energyData[bp.life].food}</p>
                            </div>
                        </div>
                        
                        <div class="bg-accent/30 p-4 rounded-xl border border-accent">
                            <h4 class="font-medium text-sageDark text-[13px] mb-1.5 flex items-center">
                                <span class="inline-block w-1.5 h-1.5 rounded-full bg-sage mr-1.5"></span>求救信號：${energyData[bp.life].health}
                            </h4>
                            <p class="text-[12px] text-textMain leading-relaxed text-justify">
                                壓力大時，情緒會反映在「${energyData[bp.life].health}」。請隨時關注身體發出的緊繃信號。
                            </p>
                        </div>
                    </div>

                    <!-- Block 5: 植物女巫的香氣解藥 (針對缺數) -->
                    <div class="bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-sm border border-white/50 animate-slide-up mx-1 mt-4 relative z-10" style="animation-delay: 0.4s;">
                        <h3 class="text-sage font-serif text-base mb-4 tracking-widest flex items-center">
                            ${svgs.droplet} 能量短板解藥
                        </h3>
                        
                        <div class="space-y-3">
                            ${bp.missingNums.map(n => `
                                <div class="bg-oat p-4 rounded-xl">
                                    <div class="flex justify-between items-center mb-1.5">
                                        <h4 class="font-medium text-textMain text-[13px]">${missingNumberOils[n].type}</h4>
                                        <span class="text-[10px] text-sage border border-sage/30 px-1.5 py-0.5 rounded-md bg-white">缺數 ${n}</span>
                                    </div>
                                    <p class="text-[12px] text-sageDark font-medium mb-1">${missingNumberOils[n].name}</p>
                                    <p class="text-[12px] text-textLight leading-relaxed">${missingNumberOils[n].desc}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Block 6: 流年指引與行動儀式 -->
                    <div class="bg-accent/80 backdrop-blur-md rounded-3xl p-6 shadow-sm animate-slide-up mx-1 mt-4 relative z-10" style="animation-delay: 0.5s;">
                        <div class="mb-5 text-center border-b border-sage/10 pb-4">
                            <h4 class="text-[11px] text-sage mb-1 tracking-widest">2026 流年功課</h4>
                            <p class="text-xl font-serif text-sageDark">流年數 ${bp.personalYear} <span class="text-sm text-sage/80 ml-1 font-sans">| ${personalYearRituals[bp.personalYear].theme}</span></p>
                        </div>
                        
                        <h3 class="text-sageDark font-serif text-sm mb-3 tracking-widest text-center flex items-center justify-center">
                            ${svgs.moon} 今晚的吸嗅儀式
                        </h3>
                        
                        <ul class="space-y-3 text-[13px] text-textMain bg-white/50 p-4 rounded-xl border border-white/30">
                            <li class="flex items-start">
                                <span class="text-sage mr-2 mt-0.5">①</span>
                                <span>${personalYearRituals[bp.personalYear].step1}</span>
                            </li>
                            <li class="flex items-start">
                                <span class="text-sage mr-2 mt-0.5">②</span>
                                <span>${personalYearRituals[bp.personalYear].step2}</span>
                            </li>
                            <li class="flex items-start">
                                <span class="text-sage mr-2 mt-0.5">③</span>
                                <span><strong>默念：</strong>「${personalYearRituals[bp.personalYear].mantra}」</span>
                            </li>
                        </ul>
                    </div>
                    
                    <!-- 長圖專屬頁尾 (截圖用) -->
                    <div class="text-center mt-8 pt-5 border-t border-sage/10 mx-4 relative z-10">
                        <p class="text-[11px] text-sage/60 tracking-widest font-serif mb-1.5 flex items-center justify-center">
                            <svg class="w-3 h-3 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
                            願香氣陪伴你，走向內心的光明。
                        </p>
                        <p class="text-[9px] text-textLight/40 tracking-wider font-sans">NAT 數字能量與香氣療癒室</p>
                    </div>
                </div>
            `;
            reportContent.innerHTML = html;
        };

        document.getElementById('btn-reset').addEventListener('click', () => {
            document.getElementById('birth-date').value = '';
            switchView('view-result', 'view-input');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // --- 長圖下載功能 ---
        document.getElementById('btn-download').addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            const originalContent = btn.innerHTML;
            
            btn.innerHTML = `
                <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                <span>繪製中...</span>
            `;
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');

            try {
                const captureArea = document.getElementById('capture-area');
                
                const originalWidth = captureArea.style.width;
                const originalMaxWidth = captureArea.style.maxWidth;
                
                captureArea.style.width = '430px';
                captureArea.style.maxWidth = '430px';
                captureArea.style.margin = '0 auto';
                
                const animatedEls = captureArea.querySelectorAll('.animate-slide-up');
                animatedEls.forEach(el => {
                    el.classList.remove('animate-slide-up');
                    el.style.opacity = '1';
                    el.style.transform = 'none';
                });

                await new Promise(resolve => setTimeout(resolve, 300));
                
                const canvas = await html2canvas(captureArea, {
                    scale: 3, 
                    useCORS: true, 
                    backgroundColor: '#F9F8F6', 
                    width: 430, 
                    windowWidth: 430, 
                    logging: false
                });
                
                const imgData = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.download = `香氣數字室_${document.getElementById('birth-date').value}.png`;
                link.href = imgData;
                link.click();
                
                captureArea.style.width = originalWidth;
                captureArea.style.maxWidth = originalMaxWidth;
                
            } catch (error) {
                console.error('長圖生成失敗:', error);
                alert('很抱歉，圖片生成失敗，請稍後再試。');
            } finally {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
